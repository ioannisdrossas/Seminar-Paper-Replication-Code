root_path: './' # Folder must contain data/
datasets: [BPIC_2013_closed, BPIC_2020_travel, sepsis] # BPIC_2013_closed | BPIC_2020_travel | sepsis

architectures: [LSTM] # LSTM | transformer
losses: [baseline, GLL, LLL] # baseline | GLL | LLL

noise_levels: [10, 20, 30, 40] # 10 | 20 | 30 | 40
alpha_levels: [0.05, 0.15, 0.25, 0.35, 0.45, 0.55, 0.65, 0.75, 0.85, 0.95] # 0 <= alpha <= 1
temperature: 0.7 # sampling temperature at test time
nr_runs: 5 # Number of runs for each configuration (paper: 15)

hidden_dim: 100 # Number of hidden dimensions of architecture
batch_size: 64
nr_epochs: 2000 # Total number of epochs
min_epochs: 500 # Minimum number of epochs before early stopping
lr: 0.0005 # Learning rate of optimizer

patience: 35 # Patience of early stopping
min_delta: 0.00001 # Min loss difference
min_loss: 0.01 # Min loss
gll_samples: 5 # Monte Carlo continuations sampled per trace in GLL (paper: 10)
